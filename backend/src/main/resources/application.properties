spring.application.name=backend

# DATABASE
spring.datasource.url=${DB_URL}?sslmode=require&channelBinding=require
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# REDIS
spring.data.redis.url=${REDIS_URL}

# GOOGLE OAUTH
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}

# KAFKA
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}
spring.kafka.consumer.max-poll-records=1
spring.kafka.listener.ack-mode=manual

# SSL Configuration
spring.kafka.security.protocol=SSL
spring.kafka.ssl.trust-store-location=classpath:client.truststore.jks
spring.kafka.ssl.trust-store-password=${KAFKA_TRUSTSTORE_PASSWORD}
spring.kafka.ssl.key-store-type=PKCS12
spring.kafka.ssl.key-store-location=classpath:client.keystore.p12
spring.kafka.ssl.key-store-password=${KAFKA_KEYSTORE_PASSWORD}
spring.kafka.ssl.key-password=${KAFKA_KEY_PASSWORD}

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.LongSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.LongDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# GROQ AI
spring.groq.api.key=${GROQ_API_KEY}

# SENDGRID
spring.sendgrid.api-key=${SENDGRID_API_KEY}

# JWT
spring.jwt.secret=${JWT_SECRET}